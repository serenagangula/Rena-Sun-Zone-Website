<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Confirmed | Rena Handmade</title><link rel="stylesheet" href="style.css"></head><body>
<div class="topbar">♥ Thank you for shopping handmade ♥</div><header class="nav"><div class="nav-inner"><a href="index.html"><img class="logo" src="assets/rena-logo.jpg" alt="Rena logo"></a><nav class="navlinks"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="gallery.html">Gallery</a><a href="contact.html">Contact</a></nav></div></header>
<main><section class="section"><div class="banner" style="max-width:800px;margin:40px auto"><div style="font-size:70px">🎉</div><h1>Order Confirmed!</h1><p>Your order has been placed successfully. 💕</p><div id="details"><p>Loading your order details...</p></div><a class="btn" href="shop.html">Continue Shopping →</a></div></section></main><footer><div class="footer-grid"><div><img class="logo" src="assets/rena-logo.jpg" alt="Rena logo"><p>Made with love by Rena ♡</p></div></div></footer>
<script>
(async()=>{const id=new URLSearchParams(location.search).get('order');const d=document.getElementById('details');if(!id){d.innerHTML='<p>Order ID is not available.</p>';return}try{const r=await fetch('/api/order/'+encodeURIComponent(id));const o=await r.json();if(r.ok){d.innerHTML='<p><b>Order ID:</b> '+o.orderId+'</p><p><b>Order status:</b> Confirmed ✅</p><p><b>Total:</b> ₹'+Number(o.total).toLocaleString('en-IN')+'</p><p><b>Date & Time:</b> '+o.dateTime+'</p><p>Order confirmation details have been sent to Rena by email. 💌</p>';}else d.innerHTML='<p>Order ID: '+id+'</p>'}catch{d.innerHTML='<p>Order ID: '+id+'</p>'}})();
</script></body></html>
